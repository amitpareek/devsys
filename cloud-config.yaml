#cloud-config
#
# devsys VM bootstrap — cloud-init user-data for Debian 12/13.
#
# Everything cloud-init can do declaratively, it does: apt repos via
# apt.sources, every apt-installable tool via packages, the account via
# users, config via write_files. runcmd is reserved for the tools that have
# no Debian package at all and therefore no declarative form (see the list
# at the bottom).
#
# ─────────────────────────────────────────────────────────────────────────────
# EDIT before use:
#   1. hostname            — also becomes the tailnet machine name
#   2. users[0].name       — the developer who gets the box
#   3. ssh_authorized_keys — their public key(s)
#   4. TS_AUTHKEY          — optional; read the security note first
# ─────────────────────────────────────────────────────────────────────────────
#
# Works anywhere cloud-init runs: Hetzner, DigitalOcean, Vultr, AWS, GCP,
# Azure, Proxmox, multipass, libvirt. Paste as "user data".
#
# Logs: /var/log/devsys-bootstrap.log   Done marker: /var/lib/devsys-bootstrap.done

hostname: devbox-01
manage_etc_hosts: true

users:
  - name: dev
    # bash on purpose. cloud-init creates users BEFORE packages, so /bin/zsh
    # does not exist yet; naming it here leaves the account unable to log in.
    # runcmd switches it to zsh once the shell packages are installed.
    shell: /bin/bash
    groups: [sudo]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAREPLACE_WITH_YOUR_PUBLIC_KEY you@example.com

# ── Third-party apt repos, declared natively ────────────────────────────────
# $RELEASE expands to the distro codename, $KEY_FILE to where cloud-init put
# the key. Four keys come from a keyserver (a few bytes each); only eza's is
# inlined, because it is not on keyserver.ubuntu.com.
#
# Why keyid over inline keys: all five armoured keys total ~21 KB, and EC2
# caps user-data at 16 KB. Fingerprints below were taken from each vendor's
# published key, not from documentation.
apt:
  sources:
    docker.list:
      source: "deb [signed-by=$KEY_FILE] https://download.docker.com/linux/debian $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      keyserver: keyserver.ubuntu.com

    tailscale.list:
      source: "deb [signed-by=$KEY_FILE] https://pkgs.tailscale.com/stable/debian $RELEASE main"
      keyid: 2596A99EAAB33821893C0A79458CA832957F5868
      keyserver: keyserver.ubuntu.com

    github-cli.list:
      source: "deb [signed-by=$KEY_FILE] https://cli.github.com/packages stable main"
      keyid: 2C6106201985B60E6C7AC87323F3D4EA75716059
      keyserver: keyserver.ubuntu.com

    # glow. Debian 13 ships glow natively; harmless to have both.
    charm.list:
      source: "deb [signed-by=$KEY_FILE] https://repo.charm.sh/apt/ * *"
      keyid: ED927B38BE981E53CA09153D03BBF595D4DFD35C
      keyserver: keyserver.ubuntu.com

    # eza. Not in Debian 12 or 13, and its key is not on any keyserver, so
    # this is the one repo whose key has to be carried inline.
    gierens.list:
      source: "deb [signed-by=$KEY_FILE] http://deb.gierens.de stable main"
      key: |
