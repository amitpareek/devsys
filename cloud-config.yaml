# ── Every apt-installable tool, declared natively ───────────────────────────
# Trim to taste. Deliberately NOT listed here: .NET's ICU/OpenSSL runtime
# deps, whose package names are release-specific (libicu72 on Debian 12,
# libicu76 on 13; libssl3 vs libssl3t64) — install-tools.sh resolves those
# per release instead of guessing here.
package_update: true
package_upgrade: false
packages:
  # base
  - ca-certificates
  - curl
  - wget
  - gnupg
  - lsb-release
  - git
  - vim
  - less
  - zsh
  - unzip
  - rsync
  - jq
  - iputils-ping
  - net-tools
  # bind9-dnsutils, not the old `dnsutils` name: Debian 13 dropped that
  # transitional package. It still installs there via the virtual provider,
  # but naming the real package removes the ambiguity.
  - bind9-dnsutils
  - openssh-client
  # openssh-server too: Tailscale SSH is served by tailscaled and needs no
  # sshd, but relying on it alone means a tailscaled failure or a deauthorized
  # node locks you out with only the provider console left. sshd is the
  # fallback. Cloud images usually have it already, so this is a no-op there.
  # NOTE: this opens port 22 to whatever your firewall allows. The dev user
  # has lock_passwd, so it is key-only, but Debian still ships
  # PasswordAuthentication yes for other accounts.
  - openssh-server
  # build
  - build-essential
  - pkg-config
  - python3
  - python3-pip
  - python3-venv
  # editors
  - nano
  - micro
  # cli
  - ripgrep
  - fd-find
  - bat
  - fzf
  - htop
  - ncdu
  - eza
  - glow
  # shell
  - direnv
  - tmux
  - bash-completion
  # auth (devsys-auth encrypts bundles with age)
  - age
  # tailnet
  - tailscale
  # data services
  - redis-server
  - postgresql-client
  # docker
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

write_files:
  - path: /etc/devsys/bootstrap.conf
    permissions: '0600'
    owner: root:root
    content: |
      # Sourced by a shell, so every value containing spaces MUST be quoted.

      # SECURITY: user-data is readable from the instance metadata service by
      # anything running on this VM, and many providers keep it retrievable
      # for the instance's whole life. Leave empty to install Tailscale
      # without joining. If you set it, use a short-lived, tagged, single-use
      # key and treat it as burned once the VM boots.
      TS_AUTHKEY=""

      # The account that owns this box — per-user actions (docker group,
      # login checks, ai-yolo config) apply to this user, not root.
      DEVSYS_USER="dev"

      # Groups whose NON-APT parts still need installing. The apt-installable
      # tools are already handled declaratively above; install-tools.sh finds
      # them present and skips them.
      DEVSYS_GROUPS="tailscale base build editors cli shell mise node python notes auth"

      # Tailnet join settings for the unattended path. The installer prompts
      # for these interactively; preset here they are used as-is.
      TS_SSH="true"
      TS_TAGS=""

      # Pin to a tag/commit for reproducible rebuilds.
      DEVSYS_REF="main"

  - path: /usr/local/sbin/devsys-bootstrap.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      #
      # Handles only what apt cannot: mise (+ node/python), bun, starship,
      # lazygit, flyctl, the .NET SDK, the npm-installed CLIs, the system zsh
      # and bash wiring, shell completions, z and devsys-auth. Everything
      # apt-installable was already declared in this VM's user-data.
      #
      # Safe to re-run — install-tools.sh is idempotent.
      set -euo pipefail

      LOG=/var/log/devsys-bootstrap.log
      exec >>"$LOG" 2>&1
      echo "=== devsys bootstrap starting: $(date -Is) ==="

      # shellcheck disable=SC1091
      set -a; . /etc/devsys/bootstrap.conf; set +a

      : "${DEVSYS_USER:=dev}"
      : "${DEVSYS_REF:=main}"
      : "${DEVSYS_GROUPS:=tailscale base editors cli shell mise node}"
      RAW="https://raw.githubusercontent.com/amitpareek/devsys/${DEVSYS_REF}"

      echo "--- fetching install-tools.sh (ref: $DEVSYS_REF)"
      curl -fsSL --retry 5 --retry-delay 3 \
        "$RAW/install-tools.sh" -o /usr/local/bin/install-tools.sh
      chmod +x /usr/local/bin/install-tools.sh

      # -y: no prompts, and skips the hand-over pause.
      # --no-login-check: OAuth flows need a browser and a human; the
      # developer runs `install-tools.sh --check-logins` after they SSH in.
      echo "--- installing non-apt tools for groups: $DEVSYS_GROUPS"
      # shellcheck disable=SC2086
      DEVSYS_USER="$DEVSYS_USER" TS_AUTHKEY="${TS_AUTHKEY:-}" \
        TS_SSH="${TS_SSH:-true}" TS_TAGS="${TS_TAGS:-}" \
        bash /usr/local/bin/install-tools.sh -y --no-login-check $DEVSYS_GROUPS

      # zsh exists now, so switching the account to it is safe.
      if command -v zsh >/dev/null 2>&1 && id "$DEVSYS_USER" >/dev/null 2>&1; then
        chsh -s "$(command -v zsh)" "$DEVSYS_USER" || true
        echo "--- default shell for $DEVSYS_USER: $(command -v zsh)"
      fi

      # Remove the key from disk. Note this does NOT remove it from the
      # instance metadata service.
      if [ -n "${TS_AUTHKEY:-}" ]; then
        sed -i 's/^TS_AUTHKEY=.*/TS_AUTHKEY=""/' /etc/devsys/bootstrap.conf
        echo "--- cleared TS_AUTHKEY from /etc/devsys/bootstrap.conf"
      fi

      touch /var/lib/devsys-bootstrap.done
      echo "=== devsys bootstrap finished: $(date -Is) ==="
      command -v tailscale >/dev/null 2>&1 && tailscale status || true

runcmd:
  - [ bash, /usr/local/sbin/devsys-bootstrap.sh ]

final_message: |
  devsys bootstrap complete after $UPTIME seconds.
  Log:  /var/log/devsys-bootstrap.log
  Next: install-tools.sh --check-logins   # authenticate gh, fly, AI CLIs
        sudo tailscale up                 # only if TS_AUTHKEY was empty
